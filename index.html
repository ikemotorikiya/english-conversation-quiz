<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1f2733">
  <title>英会話フレーズクイズ</title>
  <style>
    :root {
      --bg: #edf1f5;
      --card: #ffffff;
      --ink: #1d2733;
      --muted: #647181;
      --navy: #1f2733;
      --blue: #2868d8;
      --blue-soft: #eff5ff;
      --line: #dce3eb;
      --ok: #147a52;
      --ok-soft: #eaf8f1;
      --ng: #bf3d42;
      --ng-soft: #fff0f0;
      --shadow: 0 10px 28px rgba(30, 46, 66, .08);
    }

    * { box-sizing: border-box; }

    html { -webkit-text-size-adjust: 100%; }

    body {
      min-width: 320px;
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", "Noto Sans JP", sans-serif;
      line-height: 1.65;
    }

    button { font: inherit; }

    .wrap {
      width: min(760px, calc(100% - 28px));
      margin: 22px auto;
      padding-bottom: calc(96px + env(safe-area-inset-bottom));
    }

    .hero {
      padding: 26px 22px;
      border-radius: 24px;
      color: #fff;
      background:
        radial-gradient(circle at 88% 12%, rgba(89, 157, 255, .36), transparent 28%),
        linear-gradient(135deg, #16202d, #2a3b52);
      box-shadow: var(--shadow);
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      min-height: 28px;
      padding: 3px 10px;
      border: 1px solid rgba(255, 255, 255, .28);
      border-radius: 999px;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: .04em;
    }

    h1 {
      margin: 12px 0 6px;
      font-size: clamp(28px, 7vw, 42px);
      line-height: 1.2;
      letter-spacing: -.03em;
    }

    .hero p { margin: 0; color: #dce7f4; font-size: 14px; }

    .challenge-progress {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 18px;
      color: #dce7f4;
      font-size: 13px;
      font-weight: 800;
    }

    .progress-track {
      flex: 1;
      height: 7px;
      overflow: hidden;
      border-radius: 999px;
      background: rgba(255, 255, 255, .22);
    }

    .progress-bar {
      width: 0;
      height: 100%;
      border-radius: inherit;
      background: #7fb0ff;
      transition: width .25s ease;
    }

    .question {
      margin: 14px 0;
      padding: 20px;
      border: 1px solid var(--line);
      border-radius: 20px;
      background: var(--card);
      box-shadow: var(--shadow);
    }

    .qnum {
      margin-bottom: 8px;
      color: var(--blue);
      font-size: 12px;
      font-weight: 900;
      letter-spacing: .1em;
    }

    .question h2 {
      margin: 0 0 16px;
      font-size: clamp(18px, 5vw, 21px);
      line-height: 1.55;
      letter-spacing: -.015em;
    }

    .answers {
      display: grid;
      grid-template-columns: 1fr;
      gap: 10px;
    }

    .answer {
      display: block;
      width: 100%;
      min-height: 64px;
      padding: 12px 14px;
      border: 1px solid #cfd8e2;
      border-radius: 14px;
      background: #fff;
      color: var(--ink);
      text-align: left;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
      transition: transform .14s ease, border-color .14s ease, box-shadow .14s ease, background .14s ease;
    }

    .answer:active { transform: scale(.985); }

    .answer:hover { border-color: #91b4f2; }

    .answer:focus-visible {
      outline: 3px solid rgba(40, 104, 216, .3);
      outline-offset: 2px;
    }

    .answer.selected {
      border-color: var(--blue);
      background: var(--blue-soft);
      box-shadow: 0 0 0 3px rgba(40, 104, 216, .13);
    }

    .answer.correct { border-color: var(--ok); background: var(--ok-soft); }
    .answer.wrong { border-color: var(--ng); background: var(--ng-soft); }
    .answer:disabled { cursor: default; }

    .choice-row { display: flex; align-items: flex-start; gap: 10px; }

    .choice-letter {
      display: grid;
      flex: 0 0 26px;
      width: 26px;
      height: 26px;
      place-items: center;
      border-radius: 50%;
      background: #e8edf3;
      color: #405163;
      font-size: 12px;
      font-weight: 900;
      line-height: 1;
    }

    .selected .choice-letter { background: var(--blue); color: #fff; }
    .correct .choice-letter { background: var(--ok); color: #fff; }
    .wrong .choice-letter { background: var(--ng); color: #fff; }

    .phrase { display: block; font-size: 17px; font-weight: 850; line-height: 1.35; }
    .reading { display: block; margin-top: 3px; color: var(--muted); font-size: 12px; font-weight: 700; line-height: 1.45; }

    .explain {
      display: none;
      margin-top: 16px;
      padding: 16px;
      border: 1px solid #d6e4f6;
      border-radius: 14px;
      background: #f6faff;
      color: #344353;
      font-size: 14px;
      line-height: 1.8;
    }

    .explain strong { display: block; margin-bottom: 8px; color: var(--ink); font-size: 16px; }
    .explain p { margin: 7px 0; }
    .explain-label { color: var(--blue); font-weight: 900; }

    .result {
      display: none;
      margin: 22px 0 0;
      padding: 24px 18px;
      border: 1px solid var(--line);
      border-radius: 20px;
      background: #fff;
      box-shadow: var(--shadow);
      text-align: center;
    }

    .result h2 { margin: 0 0 8px; font-size: 28px; line-height: 1.3; }
    .result p { margin: 0 0 16px; color: var(--muted); }

    .controls {
      position: sticky;
      bottom: max(12px, env(safe-area-inset-bottom));
      z-index: 5;
      display: block;
      margin-top: 20px;
      padding: 10px;
      border: 1px solid rgba(202, 213, 224, .92);
      border-radius: 18px;
      background: rgba(245, 248, 251, .94);
      box-shadow: 0 9px 25px rgba(30, 46, 66, .12);
      backdrop-filter: blur(12px);
    }

    .btn {
      min-height: 54px;
      padding: 12px 18px;
      border: 0;
      border-radius: 13px;
      cursor: pointer;
      font-size: 16px;
      font-weight: 900;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }

    .btn:active { transform: scale(.985); }
    .btn-primary { background: var(--blue); color: #fff; }
    .btn-secondary { background: var(--navy); color: #fff; }
    .btn-outline { border: 1px solid #c7d2de; background: #fff; color: #405163; }
    .btn:disabled { opacity: .42; cursor: not-allowed; }
    .note { margin: 17px 0 0; color: var(--muted); font-size: 12px; text-align: center; }

    @media (min-width: 700px) {
      .wrap { margin-top: 32px; }
      .question { padding: 24px; }
    }

    @media (max-width: 460px) {
      .wrap { width: min(100% - 20px, 760px); margin-top: 10px; }
      .hero { padding: 22px 18px; border-radius: 20px; }
      .question { padding: 18px 15px; border-radius: 17px; }
      .question h2 { font-size: 18px; }
      .phrase { font-size: 16px; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header class="hero">
      <span class="eyebrow">日常会話・初級</span>
      <h1>英会話フレーズクイズ</h1>
      <p>日常の場面に合う英文を選びます。正解した問題はクリア済みになり、不正解の問題は8問以上あとに再出題されます。</p>
      <div class="challenge-progress" aria-live="polite">
        <span id="progressText">クリア 0 / 100</span>
        <span class="progress-track" aria-hidden="true"><span id="progressBar" class="progress-bar"></span></span>
      </div>
    </header>

    <main id="quiz"></main>

    <section id="result" class="result" aria-live="polite">
      <h2 id="resultTitle"></h2>
      <p id="resultText"></p>
      <button id="actionBtn" class="btn btn-secondary" type="button" style="display:none"></button>
    </section>

    <div class="controls">
      <button id="resetBtn" class="btn btn-outline" type="button">学習記録をリセット</button>
    </div>

    <p class="note">学習記録は、このブラウザ内に保存されます。</p>
  </div>

  <script>
    const REVIEW_GAP = 8;
    const STORAGE_KEY = "everyday-english-quiz-progress-v2";

    function make(scene, answer, reading, meaning, words, tip) {
      return { scene, answer, reading, meaning, words, tip, grammar: grammarFor(answer) };
    }

    function grammarFor(answer) {
      const exact = {
        "Nice to meet you.": "nice + to + 動詞の原形で「〜できてうれしい」。to の後ろは meet のように動詞の原形にします。",
        "How have you been?": "How + have + 主語 + been? は現在完了の形です。過去から今までの近況をたずねます。",
        "I'm good, thanks.": "I’m は I am の短縮形です。be動詞の後ろに good のような形容詞を置いて状態を伝えます。",
        "See you later.": "See you + 時を表す語で「また〜に会おう」。くだけた会話では I’ll を省いた定番の別れの表現です。",
        "Have a nice day.": "Have + a + 名詞で、相手への願いを伝えます。命令ではなく「よい一日を」というあいさつです。",
        "Sorry I'm late.": "Sorry の後ろに、遅れた事実を I’m late と続けています。I’m は I am の短縮形です。",
        "No problem.": "No + 名詞で「問題なし」。短い決まり文句なので、主語や動詞は入れません。",
        "Excuse me.": "Excuse me はまとまりで覚える決まり文句です。人の注意を引く「すみません」に使います。",
        "I don't understand.": "一般動詞 understand の否定は do not + 動詞の原形です。don’t は do not の短縮形です。",
        "What does that mean?": "疑問文では does + 主語 + 動詞の原形になります。does の後ろを means にはしません。",
        "How do you spell that?": "How + do + 主語 + 動詞の原形で方法を聞きます。spell は動詞の原形です。",
        "Let me think.": "Let + 人 + 動詞の原形で「人に〜させて」。Let me think は「少し考えさせて」です。",
        "I'm on my way.": "be on one’s way は「〜へ向かっている途中」という決まった言い方です。",
        "I'm running late.": "be running late で「予定より遅れそう・遅れている」。run を「走る」と直訳しない表現です。",
        "I'm almost there.": "be almost there で「目的地まであと少し」。there は目的地を指します。",
        "Take care.": "Take care はまとまりで「気をつけて」。careful などに変えず、この形で使います。",
        "See you tomorrow.": "See you + tomorrow で「また明日」。tomorrow の前には通常 at を付けません。",
        "What do you recommend?": "What + do + 主語 + 動詞の原形で「何をおすすめしますか」。recommend は原形です。",
        "I'll have this.": "I’ll have + 名詞／指す物で、注文するときの「〜にします」。I’ll は I will の短縮形です。",
        "Is this spicy?": "be動詞の疑問文は Is + 主語 + 形容詞? の語順です。spicy は「辛い」という形容詞です。",
        "It's delicious.": "It’s は It is の短縮形。be動詞の後ろに delicious のような形容詞を置きます。",
        "I'm full.": "I’m + 形容詞で状態を表します。full はここでは「満腹の」です。",
        "How much is this?": "How much + be動詞 + 主語? で値段をたずねます。much は数ではなく値段・量に使います。",
        "I'm just looking.": "I’m + 動詞ing で「今〜している」。just looking は店での「見ているだけ」の自然な言い方です。",
        "Where is the restroom?": "Where + be動詞 + 場所・物? で場所をたずねます。主語 the restroom の前に is を置きます。",
        "I missed my train.": "missed は miss の過去形です。すでに乗り遅れた出来事なので過去形にします。",
        "Which platform is it?": "Which + 名詞 + be動詞 + 主語? で「どの〜ですか」。it は探している電車・便を指します。",
        "Is this seat taken?": "be + 過去分詞の taken は「取られている・使用中」の状態を表します。",
        "What time do we arrive?": "What time + do + 主語 + 動詞の原形? で到着時刻を聞きます。arrive は原形です。",
        "I'm lost.": "I’m + 形容詞で状態を表します。lost はここでは「道に迷っている」です。",
        "Is it within walking distance?": "within + 名詞で「〜の範囲内」。walking distance は「歩いて行ける距離」という名詞のまとまりです。",
        "One ticket to London, please.": "注文では「数 + 名詞 + to + 行き先」で十分通じます。文の主語・動詞を省いた定型の注文表現です。",
        "Is breakfast included?": "be動詞 + 過去分詞の included で「含まれていますか」。料金に含まれるサービスを聞く形です。",
        "What time is check-out?": "What time + be動詞 + 名詞? で時刻を聞きます。check-out はこの文では名詞です。",
        "Can we talk for a minute?": "Can + 主語 + 動詞の原形で「〜できますか」。for a minute は厳密な1分ではなく「少し」の意味です。",
        "Do you have a moment?": "Do + 主語 + 動詞の原形で「〜ありますか」。have a moment は「少し時間がある」のまとまりです。",
        "That sounds good.": "That + sounds + 形容詞で「それは〜そうだ」。sounds の後ろには good のような形容詞を置きます。",
        "I agree.": "agree は一般動詞です。I agree のように be動詞を入れずに使います。",
        "I'm not sure.": "I’m + not + 形容詞で「確信がない」。sure は形容詞です。",
        "Let's take a break.": "Let’s + 動詞の原形で、相手を含めた「〜しよう」という提案です。",
        "Thank you for your help.": "Thank you for + 名詞で「〜をありがとう」。for の後ろには help のような名詞を置きます。",
        "I appreciate it.": "appreciate は「感謝する」という一般動詞です。it は相手の助けや配慮を指します。",
        "Sorry to keep you waiting.": "keep + 人 + 動詞ing で「人を〜し続けさせる」。to keep は sorry の理由を補っています。",
        "What time works for you?": "What time + works for + 人? で「どの時間が都合に合いますか」。time が単数なので works です。",
        "Can you give me a hand?": "give + 人 + 物で「人に物を与える」。a hand はここでは「手助け」という慣用的な意味です。",
        "That's a good idea.": "That’s は That is の短縮形。a + 形容詞 + 名詞の順で a good idea になります。",
        "Let me know.": "Let + 人 + 動詞の原形で「人に〜させて」。know はここでは「知らせる」の意味です。",
        "I'll think about it.": "think about + 名詞で「〜について考える」。it は提案や依頼の内容を指します。",
        "I'm tired.": "I’m + 形容詞で状態を表します。tired は「疲れた」という形容詞です。",
        "I'm hungry.": "I’m + 形容詞で状態を表します。hungry は「空腹の」という形容詞です。",
        "I'm thirsty.": "I’m + 形容詞で状態を表します。thirsty は「のどが渇いた」という形容詞です。",
        "I have a headache.": "have + a + 症状で「〜がある」。headache は数えられる名詞なので a を付けます。",
        "I need some rest.": "need + 名詞で「〜が必要」。rest はここでは数えない名詞なので some を使います。",
        "I'm looking forward to it.": "look forward to + 名詞／動詞ing で「〜を楽しみにする」。この to は前置詞なので、後ろは動詞の原形にしません。",
        "I had a great time.": "had は have の過去形です。have a great time で「楽しい時間を過ごす」というまとまりです。",
        "It was nice talking to you.": "It was nice + 動詞ing で「〜できてよかった」。talking は動名詞で、会話したことを表します。",
        "I'm sorry to hear that.": "I’m sorry to + 動詞の原形で「〜して残念です」。to hear that が残念に思う理由を表します。",
        "Congratulations!": "Congratulations はこの形で「おめでとう」。通常は複数形の s を付けた形を使います。",
        "Good luck!": "Good luck はまとまりで「幸運を祈る・がんばって」。luck を lucky に変えません。",
        "I'm glad to hear that.": "I’m glad to + 動詞の原形で「〜してうれしい」。to hear that がうれしい理由です。",
        "That makes sense.": "make sense で「筋が通る・納得できる」。主語 That が単数なので makes になります。",
        "Really?": "Really? は一語で使う短い質問です。be動詞や do を足す必要はありません。",
        "Are you okay?": "be動詞の疑問文は Are + 主語 + 形容詞?。okay は「大丈夫な」という形容詞です。",
        "I don't feel well.": "feel + 副詞 well で「気分・体調がよい」。否定は don’t feel well です。",
        "Please be careful.": "Please + 動詞の原形で、丁寧な依頼になります。be の後ろに形容詞 careful を置きます。",
        "It doesn't matter.": "It + doesn’t + 動詞の原形で「それは重要ではない」。doesn’t の後ろは matter と原形にします。",
        "That's okay.": "That’s は That is の短縮形。okay は「大丈夫な・問題ない」という形容詞です。",
        "I'm kidding.": "I’m + 動詞ing で「今〜している」。kidding は「冗談を言っている」です。"
      };
      if (exact[answer]) return exact[answer];
      if (answer.startsWith("Could you ")) return "Could + you + 動詞の原形で、相手に丁寧に依頼します。Could の後ろは to を入れず、動詞をそのまま置きます。";
      if (answer.startsWith("Could I ")) return "Could I + 動詞の原形で、丁寧に許可や希望をたずねます。Could の後ろは動詞の原形です。";
      if (answer.startsWith("Could we ")) return "Could we + 動詞の原形で「私たちは〜できますか」。Could の後ろは動詞の原形です。";
      if (answer.startsWith("Can I ")) return "Can I + 動詞の原形で「〜してもよいですか／〜できますか」。Can の後ろは動詞の原形です。";
      if (answer.startsWith("Do you have ")) return "Do + 主語 + have ...? で「〜がありますか」。Do の後ろの have は動詞の原形です。";
      if (answer.startsWith("I'd like ")) return "I’d like + 名詞、または I’d like to + 動詞の原形で、丁寧に希望を伝えます。";
      if (answer.startsWith("I'll ")) return "I’ll は I will の短縮形です。未来の行動を伝えるとき、後ろに動詞の原形を置きます。";
      if (answer.startsWith("Where can ")) return "Where can + 主語 + 動詞の原形? で「どこで〜できますか」。can の後ろは動詞の原形です。";
      if (answer.startsWith("How long does ")) return "How long + does + 主語 + 動詞の原形? で、必要な時間をたずねます。does の後ろは動詞の原形です。";
      return "正解文は、主語・動詞・必要な語を自然な順番で並べた日常英語です。語順も含めて一まとまりで覚えましょう。";
    }

    const bank = [
      make("初対面の人に「はじめまして」と言うとき。", "Nice to meet you.", "ナイス・トゥ・ミート・ユー", "はじめまして。お会いできてうれしいです。", "Nice（ナイス：うれしい・よい） / to（トゥ：〜して） / meet（ミート：会う） / you（ユー：あなた）", "初対面のあいさつです。直訳は「あなたに会えてうれしい」です。別れ際には使いません。"),
      make("久しぶりに会った友人に「元気だった？」と聞くとき。", "How have you been?", "ハウ・ハヴ・ユー・ビーン", "これまでどうしていましたか。元気だった？", "How（ハウ：どのように） / have（ハヴ：持っている・ここでは現在完了を作る） / you（ユー：あなた） / been（ビーン：いる・過ごしてきた）", "しばらく会っていなかった相手に使う、自然な近況確認です。"),
      make("相手から「How are you?」と聞かれ、「元気です、ありがとう」と答えるとき。", "I'm good, thanks.", "アイム・グッド・サンクス", "元気です、ありがとう。", "I'm（アイム：I am＝私は〜です） / good（グッド：元気・良い） / thanks（サンクス：ありがとう）", "短く自然な返答です。丁寧にしたい場合は Thank you. でも構いません。"),

    let current = null;
    let locked = false;
    let progress = loadProgress();

    function blankRecord() {
      return { seen: 0, correct: 0, wrong: 0, completed: false, availableAfter: 0, lastAnswered: 0 };
    }

    function blankProgress() {
      return { answered: 0, records: {} };
    }

    function loadProgress() {
      try {
        const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || "null");
        if (!saved || typeof saved !== "object" || !saved.records || typeof saved.records !== "object") return blankProgress();
        return { answered: Number(saved.answered) || 0, records: saved.records };
      } catch (error) {
        return blankProgress();
      }
    }

    function saveProgress() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(progress));
      } catch (error) {
        return;
      }
    }

    function recordFor(index) {
      if (!progress.records[index]) progress.records[index] = blankRecord();
      return progress.records[index];
    }

    function shuffled(values) {
      const result = [...values];
      for (let i = result.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [result[i], result[j]] = [result[j], result[i]];
      }
      return result;
    }

    function choicesFor(item) {
      const wrong = nearMisses[item.answer];
      if (!wrong || wrong.length !== 3) throw new Error("選択肢データが不足しています。");
      const all = shuffled([{ text: item.answer, correct: true }, ...wrong.map(text => ({ text }))]);
      return all.map(choice => ({ ...choice, correct: Boolean(choice.correct) }));
    }

    function pronunciationFor(text, item) {
      if (text === item.answer) return item.reading;
      const words = text.match(/[A-Za-z]+(?:'[A-Za-z]+)?/g) || [];
      const missing = words.find(word => !pronunciationDictionary[word.toLowerCase()]);
      if (missing) throw new Error("発音データが不足しています：" + missing);
      return words.map(word => pronunciationDictionary[word.toLowerCase()]).join("・");
    }

    function pickNextQuestion() {
      const entries = bank
        .map((item, index) => ({ item, index, record: recordFor(index) }))
        .filter(entry => !entry.record.completed);

      if (!entries.length) return null;

      const dueReviews = entries
        .filter(entry => entry.record.wrong > 0 && entry.record.availableAfter <= progress.answered)
        .sort((left, right) => left.record.availableAfter - right.record.availableAfter || left.record.lastAnswered - right.record.lastAnswered);
      const unseen = shuffled(entries.filter(entry => entry.record.seen === 0));
      const laterReviews = entries
        .filter(entry => entry.record.wrong > 0 && entry.record.availableAfter > progress.answered)
        .sort((left, right) => left.record.availableAfter - right.record.availableAfter);

      const next = dueReviews[0] || unseen[0] || laterReviews[0];
      return { ...next, choices: choicesFor(next.item) };
    }

    function escapeHtml(value) {
      return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function updateProgress() {
      const completed = Object.values(progress.records).filter(record => record.completed).length;
      document.getElementById("progressText").textContent = `クリア ${completed} / ${bank.length}`;
      document.getElementById("progressBar").style.width = `${(completed / bank.length) * 100}%`;
    }

    function render() {
      const quiz = document.getElementById("quiz");
      quiz.innerHTML = "";

      const entry = current;
      if (!entry) {
        updateProgress();
        quiz.innerHTML = `
          <section class="question">
            <div class="qnum">ALL CLEAR</div>
            <h2>全${bank.length}問をクリアしました！</h2>
            <p>正解した問題は出題対象から外れています。もう一度学習したい場合は、下の「学習記録をリセット」を押してください。</p>
          </section>
        `;
        return;
      }
      const answers = entry.choices.map((choice, answerIndex) => `
        <button class="answer" type="button" data-a="${answerIndex}">
          <span class="choice-row">
            <span class="choice-letter">${String.fromCharCode(65 + answerIndex)}</span>
            <span>
              <span class="phrase">${escapeHtml(choice.text)}</span>
              <span class="reading">発音：${escapeHtml(pronunciationFor(choice.text, entry.item))}</span>
            </span>
          </span>
        </button>
      `).join("");

      const section = document.createElement("section");
      section.className = "question";
      section.innerHTML = `
        <div class="qnum">QUESTION</div>
        <h2>${escapeHtml(entry.item.scene)}<br>最も自然な英文は？</h2>
        <div class="answers">${answers}</div>
        <div class="explain" id="explain">
          <strong>正解：${escapeHtml(entry.item.answer)}</strong>
          <p><span class="explain-label">読み方：</span>${escapeHtml(entry.item.reading)}</p>
          <p><span class="explain-label">自然な意味：</span>${escapeHtml(entry.item.meaning)}</p>
          <p><span class="explain-label">語句の意味：</span>${escapeHtml(entry.item.words)}</p>
          <p><span class="explain-label">文の形：</span>${escapeHtml(entry.item.grammar)}</p>
          <p><span class="explain-label">使い方：</span>${escapeHtml(entry.item.tip)}</p>
          <p><span class="explain-label">選ぶポイント：</span>正しい語順だけでなく、その場面で自然に使える意味かを確認しましょう。似た語でも、意味や使い方が異なることがあります。</p>
        </div>
      `;
      quiz.appendChild(section);
      updateProgress();

      document.querySelectorAll(".answer").forEach(button => {
        button.addEventListener("click", () => answerQuestion(Number(button.dataset.a)));
      });
    }

    function updateRecord(entry, isCorrect) {
      const record = recordFor(entry.index);
      record.seen++;
      record.lastAnswered = Date.now();
      progress.answered++;
      if (isCorrect) {
        record.correct++;
        record.completed = true;
      } else {
        record.wrong++;
        record.availableAfter = progress.answered + REVIEW_GAP;
      }
      saveProgress();
    }

    function showFeedback(isCorrect) {
      const result = document.getElementById("result");
      const actionBtn = document.getElementById("actionBtn");
      result.style.display = "block";
      actionBtn.style.display = "inline-flex";

      if (!isCorrect) {
        document.getElementById("resultTitle").textContent = "不正解";
        document.getElementById("resultText").textContent = `正解と解説を確認してください。この問題は、少なくとも${REVIEW_GAP}問あとに再出題されます。`;
      } else {
        document.getElementById("resultTitle").textContent = "正解！この問題はクリアです";
        document.getElementById("resultText").textContent = "次回以降、この問題は出題されません。";
      }
      actionBtn.textContent = "次の問題へ";
      actionBtn.onclick = startNextQuestion;
      result.scrollIntoView({ behavior: "smooth", block: "center" });
    }

    function answerQuestion(answerIndex) {
      if (locked) return;
      const entry = current;
      const correctIndex = entry.choices.findIndex(choice => choice.correct);
      const isCorrect = answerIndex === correctIndex;
      locked = true;
      updateRecord(entry, isCorrect);

      document.querySelectorAll(".answer").forEach((button, index) => {
        button.disabled = true;
        if (index === correctIndex) button.classList.add("correct");
        if (index === answerIndex && !isCorrect) button.classList.add("wrong");
      });
      document.getElementById("explain").style.display = "block";
      showFeedback(isCorrect);
    }

    function hideFeedback() {
      document.getElementById("result").style.display = "none";
      const actionBtn = document.getElementById("actionBtn");
      actionBtn.style.display = "none";
      actionBtn.onclick = null;
    }

    function startNextQuestion() {
      locked = false;
      current = pickNextQuestion();
      hideFeedback();
      render();
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    document.getElementById("resetBtn").addEventListener("click", () => {
      if (!window.confirm("学習記録をすべて消去して、最初から始めますか？")) return;
      progress = blankProgress();
      try {
        localStorage.removeItem(STORAGE_KEY);
      } catch (error) {
        // ブラウザの保存機能が使えない場合も、この画面内では初期状態に戻せます。
      }
      startNextQuestion();
    });

    startNextQuestion();
  </script>
